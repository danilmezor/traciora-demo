# Shop goldens, seed v1, Russian configuration: manager questions with reference SQL on schema shop.
# Each choice a reference makes (which orders, which date, which window, how many rows, which columns) is
# said in its question or in the shop context (v1/erp/context/); every column is asked for by the question.
# Written by _build/gen_shop.py: change the generator, never this file.
# An empty question waits for a Russian writer; the SQL is final.
questions:
- id: shop-S01-accounts-lost
  question: Кто из корпоративных у нас отвалился, а кого теряем сейчас?
  asker: '2'
  sql: |
    WITH acct AS (
      SELECT customer_id, name FROM shop.customer WHERE payment_terms_days IS NOT NULL
    ), visits AS (
      SELECT o.customer_id, o.opened_at
      FROM shop.repair_order o JOIN acct a ON a.customer_id = o.customer_id
      WHERE o.order_type = 'customer_pay' AND o.status NOT IN ('declined', 'void')
    ), per_account AS (
      SELECT a.name,
             count(v.opened_at) FILTER (WHERE v.opened_at >= date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '29 days') AS last_30,
             count(v.opened_at) FILTER (WHERE v.opened_at >= date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '89 days') AS last_90,
             count(v.opened_at) FILTER (WHERE v.opened_at >= date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '179 days'
                                          AND v.opened_at < date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '149 days') AS block_before
      FROM acct a LEFT JOIN visits v ON v.customer_id = a.customer_id
      GROUP BY a.customer_id, a.name
    )
    SELECT name AS account_name
    FROM per_account
    WHERE last_90 = 0 OR last_30 < block_before / 2.0
    ORDER BY name
  expected:
    columns:
    - account_name
    nonempty: true
  rule: acct.A5.visits, acct.A6.visits
  expect_keys:
    account_name:
      Идель-Электромонтаж: 1
      Вкусный выезд: 1
  category: accounts
  notes: Accounts billed on terms only (not every company); their business is customer-pay orders, not declined or void. Lost
    and being lost as the context defines them (story S1.1), in calendar days to today.
- id: shop-S01-east-overdue
  question: У кого из корпоративных клиентов Инженерного есть просроченные счета?
  asker: '16'
  sql: |
    SELECT DISTINCT c.name AS account_name
    FROM shop.statement s
    JOIN shop.customer c ON c.customer_id = s.customer_id
    JOIN shop.location l ON l.location_id = c.created_location_id
    WHERE c.payment_terms_days IS NOT NULL
      AND l.name = 'Инженерный'
      AND s.due_on < date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk')::date
      AND NOT EXISTS (SELECT 1 FROM shop.payment p WHERE p.statement_id = s.statement_id AND p.kind = 'payment')
    ORDER BY c.name
  expected:
    columns:
    - account_name
    rows: 0
  rule: acct.others_pay_on_time
  category: accounts
  notes: 'The right answer is none: an empty result, not a guess. An account belongs to the shop that created it; overdue
    = due day past with no payment.'
- id: shop-S02-brent-cost
  question: 'Во что нам обошёлся Артур Назаров на Технической за последние 26 недель его работы, в ценах для клиента (с НДС):
    скидки, которые он дал; запчасти, выданные со склада на его имя без продажи, по себестоимости; часы, которые механики
    отметили в его нарядах больше чем на час сверх проданных, по цене нормо-часа на тот момент; и всё вместе?'
  asker: '2'
  sql: |
    WITH f1 AS (
      SELECT employee_id, left_on FROM shop.employee
      WHERE first_name = 'Артур' AND last_name = 'Назаров'
    ), disc AS (
      SELECT coalesce(sum(o.discount_total), 0) AS v
      FROM shop.repair_order o JOIN f1 ON f1.employee_id = o.advisor_id
      JOIN LATERAL (SELECT min(h.changed_at) AS at FROM shop.order_status_history h
                    WHERE h.repair_order_id = o.repair_order_id AND h.status = 'invoiced') inv ON true
      WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid') AND inv.at >= f1.left_on - 182 AND inv.at < f1.left_on + 1
    ), stock AS (
      SELECT coalesce(sum(-m.quantity * m.unit_cost), 0) AS v
      FROM shop.stock_movement m JOIN f1 ON f1.employee_id = m.employee_id
      WHERE m.kind = 'issue' AND m.order_part_id IS NULL
        AND m.moved_at >= f1.left_on - 182 AND m.moved_at < f1.left_on + 1
    ), overrun AS (
      SELECT coalesce(sum(x.over_h * x.rate), 0) AS v
      FROM (
        SELECT (SELECT coalesce(sum(extract(epoch FROM t.clock_out - t.clock_in) / 3600), 0)
                FROM shop.order_job j JOIN shop.time_entry t ON t.order_job_id = j.order_job_id
                WHERE j.repair_order_id = o.repair_order_id AND t.clock_out IS NOT NULL)
             - (SELECT coalesce(sum(l.hours), 0)
                FROM shop.order_job j JOIN shop.order_labor l ON l.order_job_id = j.order_job_id
                WHERE j.repair_order_id = o.repair_order_id AND j.status = 'approved') AS over_h,
               (SELECT r.rate FROM shop.labor_rate r
                WHERE r.location_id = o.location_id AND r.price_class = 'standard'
                  AND r.valid_from <= o.opened_at::date
                  AND (r.valid_to IS NULL OR r.valid_to >= o.opened_at::date)) AS rate
        FROM shop.repair_order o JOIN f1 ON f1.employee_id = o.advisor_id
        WHERE o.opened_at >= f1.left_on - 182 AND o.opened_at < f1.left_on + 1
      ) x
      WHERE x.over_h > 1
    )
    SELECT disc.v AS discounts_rub,
           round(stock.v, 2) AS stock_issued_without_sale_rub,
           round(overrun.v, 2) AS unbilled_clocked_hours_rub,
           round(disc.v + stock.v + overrun.v, 2) AS estimated_total_rub
    FROM disc, stock, overrun
  expected:
    columns:
    - discounts_rub
    - stock_issued_without_sale_rub
    - unbilled_clocked_hours_rub
    - estimated_total_rub
    rows: 1
    positive_columns:
    - discounts_rub
    - stock_issued_without_sale_rub
    - unbilled_clocked_hours_rub
    - estimated_total_rub
  rule: s2.total
  expect_keys:
    estimated_total_rub:
      321360: 1
  category: money
  notes: 'Three non-overlapping components and their sum, an estimate (s2.total), all in the 26 weeks to his last day; his
    discounts are those of his revenue orders (every one of them planted: cash, 15 to 30 %, no approver). ru as billed, VAT
    inside (s2.amounts_basis). Void trap: a voided order keeps its total. ru: stock issued with no order line, at cost; clocked
    hours more than one hour past an order''s sold hours, at the standard hour in force on its day.'
- id: shop-S02-discount-rule-30d
  question: Какие наряды за последние 30 дней нарушили правило по скидкам и кто из мастеров-приёмщиков оформил каждый?
  asker: '2'
  sql: |
    SELECT o.number AS order_number,
           e.first_name || ' ' || e.last_name AS advisor_name
    FROM shop.repair_order o
    JOIN shop.employee e ON e.employee_id = o.advisor_id
    WHERE o.order_type = 'customer_pay'
      AND o.status NOT IN ('declined', 'void')
      AND o.discount_approved_by_id IS NULL
      AND o.discount_total > 0.10 * (o.labor_total + o.parts_total + o.sublet_total + o.fees_total)
      AND o.opened_at >= date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '29 days'
    ORDER BY o.opened_at
  expected:
    columns:
    - order_number
    - advisor_name
    nonempty: true
  rule: s2.west.discounts_after
  expect_keys:
    advisor_name:
      Вячеслав Крюков: 2
  category: money
  notes: 'The rule: a discount above 10 % of the bill with no approver, on a customer-pay order not declined or void. Warranty
    and goodwill orders carry their whole amount in discount_total and are not discounts. The share is discount over the bill
    before discount, the same on gross (ru) or net (en) lines.'
- id: shop-S02-west-leaks
  question: Какие запчасти ушли со склада на Технической без продажи и в какие дни?
  asker: '3'
  sql: |
    SELECT m.moved_at::date AS issued_on_yyyy_mm_dd,
           p.description AS part_description
    FROM shop.stock_movement m
    JOIN shop.location l ON l.location_id = m.location_id
    JOIN shop.part p ON p.part_id = m.part_id
    WHERE l.name = 'Техническая'
      AND m.kind = 'issue'
      AND m.order_part_id IS NULL
    ORDER BY m.moved_at
  expected:
    columns:
    - issued_on_yyyy_mm_dd
    - part_description
    rows: 46
  rule: s2.f1.second
  category: money
  notes: An issue with no order line is stock that left without a sale; one row an issue. The whole history.
- id: shop-S06-west-waiting-parts
  question: Чьи машины на Технической сейчас ждут запчасти и сколько дней?
  asker: '22'
  sql: |
    SELECT c.name AS customer_name,
           v.year AS vehicle_year,
           v.make AS vehicle_make,
           v.model AS vehicle_model,
           (now() AT TIME ZONE l.time_zone)::date
             - (SELECT max(h.changed_at)::date FROM shop.order_status_history h
                WHERE h.repair_order_id = o.repair_order_id AND h.status = 'waiting_parts') AS days_waiting_count
    FROM shop.repair_order o
    JOIN shop.location l ON l.location_id = o.location_id
    JOIN shop.customer c ON c.customer_id = o.customer_id
    JOIN shop.vehicle v ON v.vehicle_id = o.vehicle_id
    WHERE l.name = 'Техническая' AND o.status = 'waiting_parts'
    ORDER BY days_waiting_count DESC, o.number
  expected:
    columns:
    - customer_name
    - vehicle_year
    - vehicle_make
    - vehicle_model
    - days_waiting_count
    nonempty: true
  rule: s6.waiting_at_t
  top:
    customer_name: Айрат Гизатуллин
  category: parts
  notes: Calendar days since the order last entered waiting_parts, counted on the shop's own clock.
- id: shop-S11-seasonal-hire-start
  question: 'По каждому сезону в нашей базе: с какой недели начинался сезон шиномонтажа, весной и осенью, и когда выходил
    сезонный шиномонтажник?'
  asker: '4'
  sql: |
    WITH hist AS (
      SELECT min(o.opened_at)::date AS start_on FROM shop.repair_order o
    ), weeks AS (
      SELECT gs::date AS week_on
      FROM hist, generate_series(date_trunc('week', hist.start_on + interval '6 days'),
                                 date_trunc('week', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '7 days',
                                 interval '7 days') AS gs
    ), tyre AS (
      SELECT w.week_on, count(j.order_job_id) AS jobs
      FROM weeks w
      LEFT JOIN shop.repair_order o ON date_trunc('week', o.opened_at)::date = w.week_on
                                   AND o.status NOT IN ('declined', 'void')
      LEFT JOIN shop.order_job j ON j.repair_order_id = o.repair_order_id AND j.status = 'approved'
           AND j.canned_job_id IN (SELECT cj.canned_job_id FROM shop.canned_job cj
                                   WHERE cj.code IN ('seasonal_tyre_change', 'seasonal_wheel_swap'))
      GROUP BY w.week_on
    ), seasons AS (
      SELECT y AS season_year, h AS season_month
      FROM hist,
           generate_series(extract(year FROM hist.start_on)::int, extract(year FROM now() AT TIME ZONE 'Europe/Ulyanovsk')::int) AS y,
           (VALUES (4), (10)) AS v(h)
      WHERE make_date(y, h, 13) >= hist.start_on
        AND make_date(y, h + 1, CASE h WHEN 4 THEN 10 ELSE 9 END) < (now() AT TIME ZONE 'Europe/Ulyanovsk')::date
    )
    SELECT s.season_year,
           s.season_month AS season_month_1_12,
           min(t.week_on) AS season_start_week_yyyy_mm_dd,
           (SELECT min(e.hired_on) FROM shop.employee e
            WHERE e.first_name = 'Рустам' AND e.last_name = 'Юсупов'
              AND extract(year FROM e.hired_on) = s.season_year
              AND (extract(month FROM e.hired_on) <= 6) = (s.season_month = 4)) AS hire_started_on_yyyy_mm_dd
    FROM seasons s
    JOIN tyre t ON extract(year FROM t.week_on) = s.season_year
               AND (extract(month FROM t.week_on) <= 6) = (s.season_month = 4)
    WHERE t.jobs > 2 * (SELECT avg(jobs) FROM tyre)
    GROUP BY s.season_year, s.season_month
    ORDER BY s.season_year, s.season_month
  expected:
    columns:
    - season_year
    - season_month_1_12
    - season_start_week_yyyy_mm_dd
    - hire_started_on_yyyy_mm_dd
    nonempty: true
  rule: season.hire
  expect_keys:
    hire_started_on_yyyy_mm_dd: '@[d for d in f4_seasons if d >= history_start]'
  category: people
  notes: 'The season as the context defines it: only seasons that lie whole inside the history count; the threshold is season.threshold
    (en month above 1.5 times the mean month of air-conditioning jobs, ru week above twice the mean week of seasonal tyre
    jobs), all shops. The hire has one employee row per season.'
