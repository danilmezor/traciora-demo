- id: shop-S15-revenue-last-month
  question: Какая у нас выручка за прошлый месяц?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT round(sum(o.total - o.tax_total), 2) AS revenue_before_tax_rub
    FROM shop.repair_order o JOIN inv ON inv.repair_order_id = o.repair_order_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
      AND inv.invoiced_at >= date_trunc('month', now() AT TIME ZONE 'Europe/Ulyanovsk') - interval '1 month'
      AND inv.invoiced_at < date_trunc('month', now() AT TIME ZONE 'Europe/Ulyanovsk')
  expected:
    columns:
    - revenue_before_tax_rub
    rows: 1
  rule: erp/context/RULES.md#money
  category: revenue
  notes: 'Void, warranty and goodwill traps: voids keep totals, free work totals zero; open orders are not revenue. Tax: before
    tax is total - tax_total in both installs.'
- id: shop-S15-average-order-by-shop
  question: Какой средний наряд был в каждом сервисе за последние 12 месяцев?
