- id: shop-S15-wrong-mileage
  question: В каких нарядах пробег явно неверный?
  asker: '4'
  sql: |
    WITH seq AS (
      SELECT o.number, o.opened_at, o.mileage_in,
             lag(o.mileage_in) OVER (PARTITION BY o.vehicle_id ORDER BY o.opened_at) AS prev_in
      FROM shop.repair_order o
      WHERE o.mileage_in IS NOT NULL
    )
    SELECT number AS order_number
    FROM seq
    WHERE mileage_in < prev_in OR mileage_in >= 10 * prev_in
    ORDER BY opened_at
  expected:
    columns:
    - order_number
    rows: 6
  rule: s15.mess
  category: quality
  notes: A reading below the car's previous one, or ten times it or more; the whole history. The ten-times readings are each
    car's last visit.
- id: shop-S15-open-over-60-days
  question: Какие наряды открыты больше 60 дней?
  asker: '2'
  sql: |
    SELECT o.number AS order_number
    FROM shop.repair_order o
    WHERE o.status NOT IN ('invoiced', 'paid', 'void', 'declined')
      AND o.opened_at::date < date_trunc('day', now() AT TIME ZONE 'Europe/Ulyanovsk')::date - 60
    ORDER BY o.opened_at
  expected:
    columns:
    - order_number
    rows: 3
  rule: s15.dates
  category: orders
  notes: Never-closed orders trap (west since the Wednesday of week T-22, main and east since the Tuesdays of T-12 and T-10);
    an account order waiting at invoiced on an unpaid or disputed statement is money owed, not open. Calendar days to today.
