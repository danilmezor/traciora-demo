- id: shop-top-jobs-90d
  question: What were the ten jobs that brought in the most money over the last 90 days?
  asker: '4'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    ), jobs AS (
      SELECT j.order_job_id, j.canned_job_id, (CASE WHEN o.tax_included THEN 1 + o.tax_rate / 100 ELSE 1 END) AS divisor
      FROM shop.repair_order o
      JOIN inv ON inv.repair_order_id = o.repair_order_id
      JOIN shop.order_job j ON j.repair_order_id = o.repair_order_id
      WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
        AND j.status = 'approved'
        AND inv.invoiced_at >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '89 days'
    ), job_money AS (
      SELECT jb.canned_job_id,
             ((SELECT coalesce(sum(l.amount - l.discount), 0) FROM shop.order_labor l WHERE l.order_job_id = jb.order_job_id)
            + (SELECT coalesce(sum(p.quantity * p.unit_price), 0) FROM shop.order_part p WHERE p.order_job_id = jb.order_job_id)
            + (SELECT coalesce(sum(sb.price), 0) FROM shop.order_sublet sb WHERE sb.order_job_id = jb.order_job_id))
             / jb.divisor AS amount
      FROM jobs jb
    )
    SELECT cj.name AS job_name,
           round(sum(jm.amount), 2) AS revenue_before_tax_usd
    FROM job_money jm JOIN shop.canned_job cj ON cj.canned_job_id = jm.canned_job_id
    GROUP BY cj.canned_job_id, cj.name
    ORDER BY revenue_before_tax_usd DESC
    LIMIT 10
  expected:
    columns:
    - job_name
    - revenue_before_tax_usd
    rows: 10
  rule: mixrow.category_revenue
  category: revenue
  notes: 'Tax trap: ru line prices hold VAT and are divided by 1 + rate; declined jobs keep their lines and are left out;
    order-level fees are not a job''s.'
- id: shop-cars-per-day
  question: On average, how many cars a weekday has each shop had over the last 12 months?
  asker: '2'
  sql: |
    WITH days AS (
      SELECT d.location_id, d.business_date
      FROM shop.cash_drawer_close d
      WHERE d.business_date >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '12 months'
        AND extract(isodow FROM d.business_date) < 6
    ), visits AS (
      SELECT o.location_id, o.opened_at::date AS day_on, count(*) AS n
      FROM shop.repair_order o
      WHERE o.status NOT IN ('declined', 'void')
        AND o.opened_at >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '12 months'
      GROUP BY o.location_id, o.opened_at::date
    )
    SELECT l.name AS shop_name,
           round(coalesce(sum(v.n), 0)::numeric / count(*), 2) AS cars_per_day_avg
    FROM days
    JOIN shop.location l ON l.location_id = days.location_id
    LEFT JOIN visits v ON v.location_id = days.location_id AND v.day_on = days.business_date
    GROUP BY l.location_id, l.name
    ORDER BY l.location_id
  expected:
    columns:
    - shop_name
    - cars_per_day_avg
    rows: 3
  rule: volume.orders_per_day.main, volume.orders_per_day.east, volume.orders_per_day.west
  category: orders
  notes: Visits on the shop's working days (a till count) over those days, the last 12 months; en asks for a weekday, so Monday
    to Friday only (the flagship's Saturday morning is left out), ru every open day.
- id: shop-busiest-weekday
  question: What's our busiest day of the week, and how many cars a day do we see on it?
  asker: '4'
  sql: |
    WITH days AS (
      SELECT DISTINCT d.business_date AS day_on
      FROM shop.cash_drawer_close d
    ), per_day AS (
      SELECT days.day_on, count(o.repair_order_id) AS n
      FROM days
      LEFT JOIN shop.repair_order o ON o.opened_at::date = days.day_on AND o.status NOT IN ('declined', 'void')
      GROUP BY days.day_on
    )
    SELECT extract(isodow FROM day_on)::int AS weekday_iso_1_7,
           round(avg(n), 2) AS cars_per_day_avg
    FROM per_day
    GROUP BY 1
    ORDER BY cars_per_day_avg DESC
    LIMIT 1
  expected:
    columns:
    - weekday_iso_1_7
    - cars_per_day_avg
    rows: 1
  rule: mixrow.weekday
  category: orders
  notes: 'All history, the company together: visits a working day (a date any shop has a till count), each order on its own
    shop''s calendar day.'
- id: shop-open-orders-now
  question: How many jobs are still open at each shop?
  asker: '4'
  sql: |
    SELECT l.name AS shop_name,
           count(*) AS open_orders_count
    FROM shop.repair_order o JOIN shop.location l ON l.location_id = o.location_id
    WHERE o.status NOT IN ('invoiced', 'paid', 'void', 'declined')
    GROUP BY l.location_id, l.name
    ORDER BY l.location_id
  expected:
    columns:
    - shop_name
    - open_orders_count
    nonempty: true
  rule: erp/context/RULES.md#orders
  category: orders
  notes: 'Open-order trap: an account order sitting at invoiced is money owed, not an open job; the never-closed orders are
    open.'
- id: shop-west-early-arrivals
  question: How many cars came into Charlotte Pike before 9 our time last week?
  asker: '2'
  sql: |
    WITH arrivals AS (
      SELECT (o.opened_at AT TIME ZONE l.time_zone) AT TIME ZONE 'America/New_York' AS home_time
      FROM shop.repair_order o JOIN shop.location l ON l.location_id = o.location_id
      WHERE l.name = 'Charlotte Pike' AND o.status NOT IN ('declined', 'void')
    )
    SELECT count(*) AS orders_count
    FROM arrivals
    WHERE home_time >= date_trunc('week', now() AT TIME ZONE 'America/New_York') - interval '7 days'
      AND home_time < date_trunc('week', now() AT TIME ZONE 'America/New_York')
      AND extract(hour FROM home_time) < 9
  expected:
    columns:
    - orders_count
    rows: 1
  rule: geo.zone_gap_hours
  category: orders
  notes: 'Clock trap: the shop''s timestamps are its own wall clock, an hour behind home; 9:00 home time is 8:00 there. A
    car that came in is a visit: not declined, not void.'
- id: shop-new-vs-returning-this-month
  question: How many new customers have we had this month, against ones who've been in before?
  asker: '2'
  sql: |
    WITH person AS (
      SELECT c.customer_id, coalesce(c.phone, 'id:' || c.customer_id) AS person_key
      FROM shop.customer c
      WHERE c.name <> 'WALK-IN CUSTOMER'
    ), visits AS (
      SELECT p.person_key, o.opened_at
      FROM shop.repair_order o JOIN person p ON p.customer_id = o.customer_id
      WHERE o.status NOT IN ('declined', 'void')
    ), first_visit AS (
      SELECT person_key, min(opened_at) AS first_at FROM visits GROUP BY person_key
    ), this_month AS (
      SELECT DISTINCT person_key FROM visits
      WHERE opened_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York')
    )
    SELECT count(*) FILTER (WHERE f.first_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York')) AS new_customers_count,
           count(*) FILTER (WHERE f.first_at < date_trunc('month', now() AT TIME ZONE 'America/New_York')) AS returning_customers_count
    FROM this_month t JOIN first_visit f ON f.person_key = t.person_key
  expected:
    columns:
    - new_customers_count
    - returning_customers_count
    rows: 1
  rule: erp.customer.returning_share
  category: customers
  notes: Duplicate trap (merge by phone), walk-in record left out, and new means first visit, not created_at (the bought shop's
    customers were all created on one day).
- id: shop-top-customers
  question: Who are our ten best customers of all time?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    ), person AS (
      SELECT c.customer_id, c.name, coalesce(c.phone, 'id:' || c.customer_id) AS person_key
      FROM shop.customer c
      WHERE c.name <> 'WALK-IN CUSTOMER'
    )
    SELECT min(p.name) AS customer_name
    FROM shop.repair_order o
    JOIN inv ON inv.repair_order_id = o.repair_order_id
    JOIN person p ON p.customer_id = o.customer_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
    GROUP BY p.person_key
    ORDER BY sum(o.total - o.tax_total) DESC
    LIMIT 10
  expected:
    columns:
    - customer_name
    rows: 10
  rule: acct.A1.average_order
  top:
    customer_name: Nickajack Delivery
  category: customers
  notes: 'Best = the most revenue, all history. Walk-in trap: the counter-sales record holds hundreds of orders and is not
    a customer; duplicate records merged by phone.'
- id: shop-no-shows-west-last-month
  question: How many no-shows did Charlotte Pike have last month?
  asker: '22'
  sql: |
    SELECT count(*) FILTER (WHERE a.status = 'no_show') AS no_shows_count
    FROM shop.appointment a JOIN shop.location l ON l.location_id = a.location_id
    WHERE l.name = 'Charlotte Pike'
      AND a.starts_at >= date_trunc('month', now() AT TIME ZONE l.time_zone) - interval '1 month'
      AND a.starts_at < date_trunc('month', now() AT TIME ZONE l.time_zone)
  expected:
    columns:
    - no_shows_count
    rows: 1
  rule: erp.appointment.outcome
  category: customers
  notes: The calendar month before this one, on the shop's own clock, by the booking's start.
- id: shop-oil-price
  question: What does a quart of each motor oil we use in oil changes cost for a passenger car today?
  asker: '6'
  sql: |
    SELECT p.brand AS oil_brand,
           min(p.list_price) AS list_price_usd_per_unit
    FROM shop.part p
    WHERE p.part_number IS NULL
      AND EXISTS (SELECT 1 FROM shop.order_part op
                  JOIN shop.order_job j ON j.order_job_id = op.order_job_id
                  JOIN shop.canned_job cj ON cj.canned_job_id = j.canned_job_id
                  WHERE cj.code = 'oil_service' AND op.part_id = p.part_id)
    GROUP BY p.brand
    ORDER BY list_price_usd_per_unit, p.brand
  expected:
    columns:
    - oil_brand
    - list_price_usd_per_unit
    rows: 3
  rule: erp/context/RULES.md#money
  category: parts
  notes: Today's list price per unit (quart or litre) of the oils the oil service uses; fluids carry no part number; the lowest
    row per brand is the passenger-car price.
- id: shop-oil-change-price
  question: What's the labor on an oil change?
  asker: '6'
  sql: |
    SELECT CASE WHEN cj.labor_pricing = 'menu' THEN cj.menu_price
                ELSE round(cj.hours * r.rate, 2) END AS oil_change_labour_usd
    FROM shop.canned_job cj
    CROSS JOIN shop.labor_rate r
    JOIN shop.location l ON l.location_id = r.location_id
    WHERE cj.code = 'oil_service'
      AND l.name = 'East Main'
      AND r.price_class = 'standard'
      AND r.valid_to IS NULL
  expected:
    columns:
    - oil_change_labour_usd
    rows: 1
  rule: price.hour.posted
  category: parts
  notes: 'Today''s price for a passenger car at the asker''s shop: en a menu price, ru hours times the posted hour (VAT inside).'
- id: shop-parts-waiting
  question: How many cars are waiting on parts right now at each shop, and how many days has the longest been waiting?
  asker: '4'
  sql: |
    SELECT l.name AS shop_name,
           count(*) AS cars_waiting_count,
           max((now() AT TIME ZONE l.time_zone)::date
               - (SELECT max(h.changed_at)::date FROM shop.order_status_history h
                  WHERE h.repair_order_id = o.repair_order_id AND h.status = 'waiting_parts')) AS longest_wait_days
    FROM shop.repair_order o JOIN shop.location l ON l.location_id = o.location_id
    WHERE o.status = 'waiting_parts'
    GROUP BY l.location_id, l.name
    ORDER BY cars_waiting_count DESC, l.location_id
  expected:
    columns:
    - shop_name
    - cars_waiting_count
    - longest_wait_days
    nonempty: true
  rule: s6.waiting_at_t
  top:
    shop_name:
    - Charlotte Pike
    - East Main
    - Bonny Oaks
    cars_waiting_count:
    - 5
    - 2
    - 1
  category: parts
  notes: Calendar days since the order last entered waiting_parts, on each shop's own calendar.
- id: shop-supplier-late
  question: How often is each supplier late?
  asker: '4'
  sql: |
    SELECT v.name AS vendor_name,
           round(count(*) FILTER (WHERE po.received_at::date > po.promised_at::date)::numeric / count(*), 3) AS late_share_float_0_1
    FROM shop.purchase_order po JOIN shop.vendor v ON v.vendor_id = po.vendor_id
    WHERE po.status = 'received'
    GROUP BY v.vendor_id, v.name
    ORDER BY late_share_float_0_1 DESC, v.name
  expected:
    columns:
    - vendor_name
    - late_share_float_0_1
    nonempty: true
  rule: parts.on_time.V2
  top:
    vendor_name: Harpeth Valley Parts Supply
  category: parts
  notes: All history; late = received on a later day than promised, over received purchase orders; cancelled orders are not
    late deliveries.
- id: shop-parts-margin-last-month
  question: What was our margin on parts last month?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT round(1 - sum(p.quantity * p.unit_cost) / nullif(sum(p.quantity * p.unit_price / (CASE WHEN o.tax_included THEN 1 + o.tax_rate / 100 ELSE 1 END)), 0), 4) AS parts_margin_float_0_1
    FROM shop.repair_order o
    JOIN inv ON inv.repair_order_id = o.repair_order_id
    JOIN shop.order_job j ON j.repair_order_id = o.repair_order_id AND j.status = 'approved'
    JOIN shop.order_part p ON p.order_job_id = j.order_job_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
      AND inv.invoiced_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York') - interval '1 month'
      AND inv.invoiced_at < date_trunc('month', now() AT TIME ZONE 'America/New_York')
  expected:
    columns:
    - parts_margin_float_0_1
    rows: 1
  rule: mixrow.parts_margin
  category: parts
  notes: 'The company together, revenue''s orders dated by first invoice. Tax trap: ru part prices hold VAT, divided out before
    the margin; part lines of declined jobs are not sales; discount_total is the labour lines''.'
- id: shop-mechanic-billed-hours
  question: How many hours did each mechanic bill last month?
  asker: '4'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT e.first_name || ' ' || e.last_name AS technician_name,
           sum(lab.hours) AS billed_hours
    FROM shop.repair_order o
    JOIN inv ON inv.repair_order_id = o.repair_order_id
    JOIN shop.order_job j ON j.repair_order_id = o.repair_order_id AND j.status = 'approved'
    JOIN shop.order_labor lab ON lab.order_job_id = j.order_job_id
    JOIN shop.employee e ON e.employee_id = lab.technician_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
      AND inv.invoiced_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York') - interval '1 month'
      AND inv.invoiced_at < date_trunc('month', now() AT TIME ZONE 'America/New_York')
    GROUP BY e.employee_id, e.first_name, e.last_name
    ORDER BY billed_hours DESC, technician_name
  expected:
    columns:
    - technician_name
    - billed_hours
    nonempty: true
  rule: erp/context/RULES.md#orders
  category: people
  notes: 'Billed hours: sold hours of revenue''s orders dated by first invoice. Warranty trap: comeback lines carry hours
    nobody pays for; sold hours, not clocked; declined jobs'' lines left out.'
- id: shop-recommended-sold-by-advisor
  question: How much of the recommended work has each advisor sold over the last 90 days?
  asker: '4'
  sql: |
    SELECT e.first_name || ' ' || e.last_name AS advisor_name,
           round(count(*) FILTER (WHERE j.status = 'approved')::numeric / count(*), 3) AS sold_share_float_0_1
    FROM shop.repair_order o
    JOIN shop.order_job j ON j.repair_order_id = o.repair_order_id
    JOIN shop.employee e ON e.employee_id = o.advisor_id
    WHERE o.status <> 'void'
      AND j.status IN ('approved', 'declined')
      AND EXISTS (SELECT 1 FROM shop.inspection_item ii WHERE ii.order_job_id = j.order_job_id)
      AND o.opened_at >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '89 days'
    GROUP BY e.employee_id, e.first_name, e.last_name
    ORDER BY sold_share_float_0_1 DESC, advisor_name
  expected:
    columns:
    - advisor_name
    - sold_share_float_0_1
    nonempty: true
  rule: sold.company
  top:
    advisor_name: Angie Holloway
  category: people
  notes: Recommended = raised from an inspection item; share over approved plus declined among those jobs, never over every
    job.
- id: shop-tech-efficiency-this-month
  question: How efficient are the techs this month?
  asker: '4'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    ), jobs AS (
      SELECT j.order_job_id
      FROM shop.repair_order o
      JOIN inv ON inv.repair_order_id = o.repair_order_id
      JOIN shop.order_job j ON j.repair_order_id = o.repair_order_id
      WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
        AND j.status = 'approved'
        AND inv.invoiced_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York')
    ), sold AS (
      SELECT lab.technician_id, sum(lab.hours) AS h
      FROM shop.order_labor lab JOIN jobs ON jobs.order_job_id = lab.order_job_id
      WHERE lab.technician_id IS NOT NULL
      GROUP BY lab.technician_id
    ), clocked AS (
      SELECT t.technician_id, sum(extract(epoch FROM t.clock_out - t.clock_in) / 3600) AS h
      FROM shop.time_entry t JOIN jobs ON jobs.order_job_id = t.order_job_id
      WHERE t.clock_out IS NOT NULL
      GROUP BY t.technician_id
    )
    SELECT e.first_name || ' ' || e.last_name AS technician_name,
           round(s.h / nullif(c.h, 0), 3) AS sold_over_clocked_float
    FROM sold s
    JOIN clocked c ON c.technician_id = s.technician_id
    JOIN shop.employee e ON e.employee_id = s.technician_id
    ORDER BY sold_over_clocked_float DESC, technician_name
  expected:
    columns:
    - technician_name
    - sold_over_clocked_float
    nonempty: true
  rule: erp.time.clocked_over_sold
  category: people
  notes: Sold hours over clocked hours on the approved jobs of revenue's orders first invoiced this month, each technician
    his own; a clock still running is left out.
- id: shop-comebacks-by-mechanic
  question: How many comebacks has each mechanic had over the last 12 months?
  asker: '2'
  sql: |
    WITH came_back AS (
      SELECT o.repair_order_id,
             (SELECT lab.technician_id
              FROM shop.order_job j JOIN shop.order_labor lab ON lab.order_job_id = j.order_job_id
              WHERE j.repair_order_id = o.repair_order_id AND j.status = 'approved' AND lab.technician_id IS NOT NULL
              GROUP BY lab.technician_id
              ORDER BY sum(lab.hours) DESC, lab.technician_id
              LIMIT 1) AS technician_id
      FROM shop.repair_order o
      WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
        AND o.opened_at >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '12 months'
        AND EXISTS (SELECT 1 FROM shop.repair_order cb
                    WHERE cb.comeback_of_id = o.repair_order_id AND cb.status <> 'void'
                      AND cb.order_type IN ('warranty', 'goodwill'))
    )
    SELECT e.first_name || ' ' || e.last_name AS technician_name,
           count(*) AS comebacks_count
    FROM came_back b
    JOIN shop.employee e ON e.employee_id = b.technician_id
    GROUP BY e.employee_id, e.first_name, e.last_name
    ORDER BY comebacks_count DESC, technician_name
  expected:
    columns:
    - technician_name
    - comebacks_count
    nonempty: true
  rule: comeback.definition
  category: quality
  notes: Counted on the paid orders opened in the last 12 months that came back (any warranty or goodwill repeat; ru has warranty
    repeats within 30 days only), each charged to the technician with the most sold hours on it, as the people rows pNN.comebacks
    count them.
- id: shop-free-work-this-year
  question: How much warranty and goodwill work have we done free this year, at its prices?
  asker: '2'
  sql: |
    SELECT round(coalesce(sum((o.labor_total + o.parts_total + o.sublet_total + o.fees_total) / (CASE WHEN o.tax_included THEN 1 + o.tax_rate / 100 ELSE 1 END)), 0), 2) AS free_work_before_tax_usd
    FROM shop.repair_order o
    WHERE o.order_type IN ('warranty', 'goodwill')
      AND o.status <> 'void'
      AND o.opened_at >= date_trunc('year', now() AT TIME ZONE 'America/New_York')
  expected:
    columns:
    - free_work_before_tax_usd
    rows: 1
  rule: erp.warranty_order_totals
  category: quality
  notes: 'Warranty trap: these orders total 0; the value of the free work is in the lines (labour + parts + sublet + fees),
    ru with VAT divided out.'
- id: shop-accounts-owed
  question: What do our company accounts owe right now, and how fast have they paid over the last six months?
  asker: '3'
  sql: |
    WITH paid AS (
      SELECT p.statement_id, min(p.received_at)::date AS paid_on
      FROM shop.payment p
      WHERE p.statement_id IS NOT NULL AND p.kind = 'payment'
      GROUP BY p.statement_id
    )
    SELECT c.name AS account_name,
           (SELECT coalesce(sum(o.total), 0) FROM shop.repair_order o
            WHERE o.customer_id = c.customer_id AND o.order_type = 'customer_pay' AND o.status = 'invoiced') AS owed_usd,
           (SELECT round(avg(pd.paid_on - s.issued_on), 2)
            FROM shop.statement s JOIN paid pd ON pd.statement_id = s.statement_id
            WHERE s.customer_id = c.customer_id AND s.issued_on >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '6 months') AS days_to_pay_avg
    FROM shop.customer c
    WHERE c.payment_terms_days IS NOT NULL
    ORDER BY owed_usd DESC, account_name
  expected:
    columns:
    - account_name
    - owed_usd
    - days_to_pay_avg
    rows: 6
  rule: acct.A1.days_to_pay
  category: accounts
  notes: 'The six accounts billed on terms (not every company). Owed: the totals of their orders still at invoiced, billed
    or not yet (en: the current month is on no statement yet). Days to pay = first payment date minus the issue date, over
    bills issued in the last six months and paid; a disputed bill is still owed.'
- id: shop-account-revenue
  question: How much did each company account bring in over the last 12 months?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT c.name AS account_name,
           coalesce(round(sum(o.total - o.tax_total), 2), 0) AS revenue_before_tax_usd
    FROM shop.customer c
    LEFT JOIN (shop.repair_order o JOIN inv ON inv.repair_order_id = o.repair_order_id)
           ON o.customer_id = c.customer_id
          AND o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
          AND inv.invoiced_at >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '12 months'
    WHERE c.payment_terms_days IS NOT NULL
    GROUP BY c.customer_id, c.name
    ORDER BY revenue_before_tax_usd DESC, account_name
  expected:
    columns:
    - account_name
    - revenue_before_tax_usd
    rows: 6
  rule: acct.A1.average_order
  top:
    account_name: Nickajack Delivery
  category: accounts
  notes: Before tax, every account billed on terms, one with nothing at 0; the most visits (A2) is not the most money (A1).
- id: shop-unpaid-orders
  question: Which orders haven't been paid yet, leaving out the company accounts?
  asker: '3'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    ), paid AS (
      SELECT p.repair_order_id, sum(CASE WHEN p.kind = 'refund' THEN -p.amount ELSE p.amount END) AS amount
      FROM shop.payment p
      WHERE p.repair_order_id IS NOT NULL
      GROUP BY p.repair_order_id
    )
    SELECT o.number AS order_number
    FROM shop.repair_order o
    JOIN inv ON inv.repair_order_id = o.repair_order_id
    JOIN shop.customer c ON c.customer_id = o.customer_id
    LEFT JOIN paid pd ON pd.repair_order_id = o.repair_order_id
    WHERE o.status = 'invoiced'
      AND o.order_type = 'customer_pay'
      AND c.payment_terms_days IS NULL
      AND o.total - coalesce(pd.amount, 0) > 0
    ORDER BY inv.invoiced_at, o.number
  expected:
    columns:
    - order_number
    nonempty: true
  rule: erp/context/RULES.md#payments
  category: money
  notes: 'Payments trap: deposits count, refunds are positive and are subtracted; a voided order can carry a payment and is
    not owed.'
- id: shop-discounts-this-month
  question: How much have we given away in discounts this month?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT round(coalesce(sum(o.discount_total / (CASE WHEN o.tax_included THEN 1 + o.tax_rate / 100 ELSE 1 END)), 0), 2) AS discounts_before_tax_usd
    FROM shop.repair_order o
    JOIN inv ON inv.repair_order_id = o.repair_order_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
      AND inv.invoiced_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York')
  expected:
    columns:
    - discounts_before_tax_usd
    rows: 1
  rule: erp/context/RULES.md#money
  category: money
  notes: 'The company together, revenue''s orders dated by first invoice, before tax. Warranty trap: a warranty or goodwill
    order''s discount_total is the whole free amount, not a discount; voids left out.'
- id: shop-cash-last-week
  question: How much cash did each shop take in last week?
  asker: '3'
  sql: |
    SELECT l.name AS shop_name,
           sum(CASE WHEN p.kind = 'refund' THEN -p.amount ELSE p.amount END) AS cash_taken_usd
    FROM shop.payment p
    JOIN shop.repair_order o ON o.repair_order_id = p.repair_order_id
    JOIN shop.location l ON l.location_id = o.location_id
    WHERE p.method = 'cash'
      AND p.received_at >= date_trunc('week', now() AT TIME ZONE 'America/New_York') - interval '7 days'
      AND p.received_at < date_trunc('week', now() AT TIME ZONE 'America/New_York')
    GROUP BY l.location_id, l.name
    ORDER BY l.location_id
  expected:
    columns:
    - shop_name
    - cash_taken_usd
    rows: 3
  rule: erp/context/RULES.md#payments
  category: money
  notes: 'Payments trap: refunds are stored positive and must be subtracted; payments, not till counts (hidden below middle).'
- id: shop-labour-rate
  question: What are our hourly labor rates right now at each shop, the standard rate and the negotiated one?
  asker: '4'
  sql: |
    SELECT l.name AS shop_name,
           max(r.rate) FILTER (WHERE r.price_class = 'standard') AS standard_rate_usd,
           max(r.rate) FILTER (WHERE r.price_class = 'company_account') AS negotiated_rate_usd
    FROM shop.labor_rate r JOIN shop.location l ON l.location_id = r.location_id
    WHERE r.valid_to IS NULL
    GROUP BY l.location_id, l.name
    ORDER BY l.location_id
  expected:
    columns:
    - shop_name
    - standard_rate_usd
    - negotiated_rate_usd
    rows: 3
  rule: price.hour.posted
  expect_keys:
    standard_rate_usd:
      135.0: 3
    negotiated_rate_usd:
      121.5: 3
  category: money
  notes: 'The row in force today; old orders carry the rate of their own date. ru: the hour holds VAT.'
