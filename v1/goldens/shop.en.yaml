    FROM shop.repair_order o
    WHERE o.status NOT IN ('invoiced', 'paid', 'void', 'declined')
      AND o.opened_at::date < date_trunc('day', now() AT TIME ZONE 'America/New_York')::date - 60
    ORDER BY o.opened_at
  expected:
