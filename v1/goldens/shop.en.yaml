- id: shop-S15-revenue-last-month
  question: What was last month's revenue?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT round(sum(o.total - o.tax_total), 2) AS revenue_before_tax_usd
    FROM shop.repair_order o JOIN inv ON inv.repair_order_id = o.repair_order_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
      AND inv.invoiced_at >= date_trunc('month', now() AT TIME ZONE 'America/New_York') - interval '1 month'
      AND inv.invoiced_at < date_trunc('month', now() AT TIME ZONE 'America/New_York')
  expected:
    columns:
    - revenue_before_tax_usd
    rows: 1
  rule: erp/context/RULES.md#money
  category: revenue
  notes: 'Void, warranty and goodwill traps: voids keep totals, free work totals zero; open orders are not revenue. Tax: before
    tax is total - tax_total in both installs.'
- id: shop-S15-average-order-by-shop
  question: What has the average order been at each shop over the last 12 months?
  asker: '2'
  sql: |
    WITH inv AS (
      SELECT h.repair_order_id, min(h.changed_at) AS invoiced_at
      FROM shop.order_status_history h
      WHERE h.status = 'invoiced'
      GROUP BY h.repair_order_id
    )
    SELECT l.name AS shop_name,
           round(avg(o.total - o.tax_total), 2) AS average_order_before_tax_usd
    FROM shop.repair_order o
    JOIN inv ON inv.repair_order_id = o.repair_order_id
    JOIN shop.location l ON l.location_id = o.location_id
    WHERE o.order_type = 'customer_pay' AND o.status IN ('invoiced', 'paid')
      AND inv.invoiced_at >= date_trunc('day', now() AT TIME ZONE 'America/New_York') - interval '12 months'
    GROUP BY l.location_id, l.name
    ORDER BY l.location_id
  expected:
    columns:
    - shop_name
    - average_order_before_tax_usd
    rows: 3
  rule: volume.average_order
  expect_keys:
    shop_name:
      East Main: 1
      Bonny Oaks: 1
      Charlotte Pike: 1
  category: revenue
  notes: Closed orders of the last 12 months before tax; the never-closed orders, voids and free warranty work are out.
- id: shop-S15-wrong-mileage
  question: Which orders have a mileage that cannot be right?
  asker: '4'
  sql: |
    WITH seq AS (
      SELECT o.number, o.opened_at, o.mileage_in,
             lag(o.mileage_in) OVER (PARTITION BY o.vehicle_id ORDER BY o.opened_at) AS prev_in
      FROM shop.repair_order o
      WHERE o.mileage_in IS NOT NULL
    )
    SELECT number AS order_number
    FROM seq
    WHERE mileage_in < prev_in OR mileage_in >= 10 * prev_in
    ORDER BY opened_at
  expected:
    columns:
    - order_number
    rows: 6
  rule: s15.mess
  category: quality
  notes: A reading below the car's previous one, or ten times it or more; the whole history. The ten-times readings are each
    car's last visit.
- id: shop-S15-open-over-60-days
  question: Which orders have been open for more than 60 days?
  asker: '2'
  sql: |
